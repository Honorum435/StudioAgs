# Panel de Aixa (Sveltia CMS): cada producto es un contenido/<id>.json y sus fotos van a public/fotos/.
# Desde acá se crean, editan y borran productos enteros: opciones, precios, filtros, plazos y más vendidos.
# Cada guardado es un commit a main y el workflow vuelve a publicar el sitio.
# panel.js suma la tabla de precios (widget: precios) y pone los códigos de las opciones al guardar.
backend:
  name: github
  repo: Honorum435/StudioAgs
  branch: main
  # Sin servidor de login: solo se entra con el token (saca el botón de GitHub, que no andaría).
  auth_methods: [token]
  commit_messages:
    create: "Panel: nuevo producto {{slug}}"
    update: "Panel: {{slug}}"
    delete: "Panel: borrar {{slug}}"
    uploadMedia: "Panel: foto {{path}}"
    deleteMedia: "Panel: borrar foto {{path}}"

site_url: https://honorum435.github.io/StudioAgs/

# El nombre del archivo de un producto nuevo sale de su nombre: "Láminas A4" → laminas-a4.
slug:
  encoding: ascii
  clean_accents: true

media_folder: public/fotos
public_folder: /fotos
media_libraries:
  # Sin bancos de fotos (Unsplash y demás): solo las fotos que sube ella.
  stock_assets: false
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1200
          height: 1200

collections:
  - name: productos
    label: Productos
    label_singular: producto
    folder: contenido
    extension: json
    format: json
    identifier_field: name
    # El nombre del archivo es la dirección de la página (producto/<id>/): se arma con el nombre al
    # crearlo y después no cambia, aunque cambie el nombre.
    slug: { template: "{{name}}", editable: false }
    create: true
    delete: true
    duplicate: true
    thumbnail: gallery.*.src
    sortable_fields:
      fields: [order, name]
      default: { field: order, direction: ascending }
    fields:
      - { name: name, label: Nombre }
      - { name: description, label: Descripción, widget: text, hint: Se ve en la tarjeta del catálogo. }
      - { name: details, label: Más texto, widget: text, required: false, hint: Solo en la página del producto. Cada renglón es un párrafo. }
      - { name: note, label: Aclaración, required: false }
      - name: gallery
        label: Fotos
        label_singular: foto
        widget: list
        min: 1
        summary: "{{alt}}"
        thumbnail: src
        hint: La primera es la de la tarjeta del catálogo. Arrastralas para cambiar el orden.
        fields:
          - { name: src, label: Foto, widget: image, choose_url: false }
          - { name: alt, label: Qué se ve, required: false, hint: Si lo dejás vacío se usa el nombre del producto. }
          - { name: contain, label: Mostrarla entera, widget: boolean, default: false }
      - name: groups
        label: Opciones
        label_singular: grupo de opciones
        widget: list
        required: false
        collapsed: true
        summary: "{{label}}"
        hint: Lo que elige la clienta, como Tamaño o Color, cada uno con sus opciones. Sin opciones, el producto tiene un solo precio.
        fields:
          - { name: id, widget: hidden } # Lo pone panel.js al guardar: lo usan los pedidos guardados.
          - { name: label, label: Nombre del grupo, hint: "Por ejemplo Tamaño, Color o Terminación." }
          - { name: changesPrice, label: Cambia el precio, widget: boolean, default: true, hint: "Apagalo si todas las opciones de este grupo cuestan lo mismo, como los colores." }
          - name: options
            label: Opciones
            label_singular: opción
            widget: list
            min: 1
            summary: "{{label}}"
            thumbnail: src
            fields:
              - { name: id, widget: hidden } # Lo pone panel.js al guardar: lo usan los pedidos guardados.
              - { name: label, label: Nombre }
              - { name: src, label: Foto, widget: image, required: false, choose_url: false, hint: "La que aparece al elegir esta opción. Sin foto, queda la que se estaba viendo." }
              - { name: alt, label: Qué se ve en la foto, required: false }
              - { name: contain, label: Mostrar la foto entera, widget: boolean, default: false }
      - name: prices
        label: Precios
        widget: precios
        hint: Una fila por cada opción, o combinación de opciones, que cambia el precio. Se arma sola con las opciones de arriba. El precio va sin puntos, por ejemplo 15000.
      - name: addOns
        label: Adicionales
        label_singular: adicional
        widget: list
        required: false
        summary: "{{label}}: $ {{price}} {{unit}}"
        hint: Extras que se suman al precio, como la maqueta de los vinilos.
        fields:
          - { name: id, widget: hidden } # Lo pone panel.js al guardar: lo usan los pedidos guardados.
          - { name: label, label: Nombre }
          - { name: price, label: Precio, widget: number, value_type: int, min: 1 }
          - { name: unit, label: Unidad, default: por unidad }
      - name: intents
        label: Para qué es
        widget: select
        multiple: true
        required: false
        hint: Los filtros de Productos y los círculos del inicio en los que aparece.
        options:
          - { label: Para regalar, value: regalar }
          - { label: Para tu emprendimiento, value: marca }
          - { label: Para decorar, value: decorar }
          - { label: Para organizarte, value: organizarte }
      - { name: personalizable, label: Personalizable, widget: boolean, default: true, hint: Muestra «Personalizable» y en el pedido le pide a la clienta que cuente su idea. }
      - { name: photoQuantity, label: Fotos que manda la clienta, required: false, hint: "Si hay que mandar fotos para hacerlo, cuántas. Por ejemplo: Una foto por cada copia. Vacío si no lleva fotos." }
      - name: leadTime
        label: Plazo de producción
        widget: object
        required: false
        hint: Sin plazo se muestra el provisorio, de 3 a 5 días hábiles.
        fields:
          - { name: min, label: Desde (días hábiles), widget: number, value_type: int, min: 1 }
          - { name: max, label: Hasta (días hábiles), widget: number, value_type: int, min: 1 }
          - { name: text, label: Cómo se lee, required: false, hint: "Si lo dejás vacío: «De 3 a 5 días hábiles», con tus números." }
      - { name: featured, label: En «Los más vendidos», widget: boolean, default: false, hint: "Del inicio. Se ven hasta 4, en el orden del catálogo." }
      - { name: order, label: Lugar en el catálogo, widget: number, value_type: int, required: false, hint: "Los números más chicos van primero. Sin número, va al final." }
